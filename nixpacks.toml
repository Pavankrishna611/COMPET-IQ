[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "python311Packages.virtualenv", "curl"]

[phases.install]
cmds = [
  "npm ci || npm install",
  "cd backend && python3 -m venv venv && ./venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "npm run build",
  "sed -i 's/\\r$//' start.sh",
  "chmod +x start.sh"
]

[start]
cmd = "bash ./start.sh"
